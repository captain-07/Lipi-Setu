<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Jakarta'; src: url('../static/fonts/PlusJakartaSans-var.woff2') format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'Hind'; src: url('../static/fonts/HindSiliguri-Regular.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Hind'; src: url('../static/fonts/HindSiliguri-Bold.woff2') format('woff2'); font-weight: 700; }
  @font-face { font-family: 'Deva'; src: url('../static/fonts/NotoSansDevanagari-Regular.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Tamil'; src: url('../static/fonts/NotoSansTamil-Regular.woff2') format('woff2'); font-weight: 400; }

  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Jakarta', system-ui, sans-serif;
    color: #0f172a;
    background:
      radial-gradient(600px 420px at -8% -18%, rgba(99,102,241,.18), transparent 62%),
      radial-gradient(520px 360px at 108% -12%, rgba(14,165,233,.14), transparent 60%),
      radial-gradient(520px 380px at 78% 112%, rgba(79,70,229,.12), transparent 62%),
      linear-gradient(135deg, #ffffff 0%, #f5f7ff 48%, #e4e9ff 100%);
    position: relative;
  }
  .wrap { display: flex; height: 100%; padding: 58px 62px 52px; gap: 34px; position: relative; z-index: 2; }
  .left { width: 690px; display: flex; flex-direction: column; }
  .badge {
    display: inline-flex; align-self: flex-start; align-items: center; gap: 8px;
    background: rgba(255,255,255,.9); border: 1px solid #c7d2fe; color: #4f46e5;
    font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    padding: 9px 16px; border-radius: 999px;
  }
  .brand { font-size: 78px; font-weight: 800; letter-spacing: -.045em; color: #312e81; line-height: 1; margin: 30px 0 18px; }
  .brand .dot { color: #6366f1; }
  .sub { font-size: 29px; line-height: 1.34; color: #475569; font-weight: 500; letter-spacing: -.015em; max-width: 640px; }
  .sub b { color: #1e1b4b; font-weight: 800; }
  .chips { display: flex; gap: 9px; margin-top: 30px; flex-wrap: wrap; }
  .chip {
    background: rgba(255,255,255,.92); border: 1px solid #c7d2fe; color: #3730a3;
    border-radius: 999px; padding: 8px 17px; font-size: 22px; line-height: 1.35;
    box-shadow: 0 2px 6px rgba(49,46,129,.05);
  }
  .bn { font-family: 'Hind'; }
  .hi { font-family: 'Deva'; }
  .ta { font-family: 'Tamil'; font-size: 20px; }
  .en { font-family: 'Jakarta'; font-size: 19px; letter-spacing: -.01em; }
  .meta { margin-top: auto; display: flex; align-items: center; gap: 14px; color: #64748b; font-size: 17px; font-weight: 700; letter-spacing: .01em; }
  .meta .line { width: 42px; height: 2px; background: #a5b4fc; border-radius: 2px; }
  .right { flex: 1; display: flex; align-items: center; justify-content: center; }
  .doc {
    width: 356px; height: 448px; background: #fff; border: 1px solid #e2e8f0; border-radius: 24px;
    box-shadow: 0 30px 60px -20px rgba(49,46,129,.35), 0 2px 0 rgba(255,255,255,.8) inset;
    padding: 26px 26px 22px; position: relative; overflow: hidden;
  }
  .doc::before { content: ''; position: absolute; inset: 0 0 auto; height: 10px; background: linear-gradient(90deg, #4f46e5, #0ea5e9); }
  .tag { display: inline-block; background: #eef2ff; color: #4f46e5; font-size: 11px; font-weight: 800; letter-spacing: .14em; padding: 6px 10px; border-radius: 7px; }
  .doc h2 { font-size: 24px; margin: 16px 0 5px; letter-spacing: -.02em; color: #0f172a; }
  .ref { font-size: 12px; color: #94a3b8; font-weight: 600; }
  .lines { margin-top: 24px; display: grid; gap: 10px; }
  .lines span { display: block; height: 7px; border-radius: 4px; background: #e2e8f0; }
  .lines span:nth-child(1) { width: 100%; }
  .lines span:nth-child(2) { width: 92%; }
  .lines span:nth-child(3) { width: 97%; }
  .lines span:nth-child(4) { width: 84%; }
  .lines span:nth-child(5) { width: 95%; }
  .lines span:nth-child(6) { width: 76%; }
  .due { margin-top: 22px; display: flex; align-items: center; gap: 9px; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 12px; padding: 11px 13px; font-size: 14px; font-weight: 800; }
  .due i { width: 9px; height: 9px; background: #dc2626; border-radius: 50%; display: inline-block; }
  .btn { position: absolute; left: 26px; bottom: 24px; background: #4f46e5; color: #fff; font-size: 13px; font-weight: 800; padding: 11px 17px; border-radius: 9px; box-shadow: 0 8px 18px -6px rgba(79,70,229,.6); }
  .stamp { position: absolute; right: 22px; bottom: 26px; font-size: 10px; color: #cbd5e1; font-weight: 800; letter-spacing: .16em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="badge">AI · Multilingual document assistant</div>
      <div class="brand">LipiSetu AI<span class="dot">.</span></div>
      <div class="sub">Official English documents,<br><b>explained in your language.</b></div>
      <div class="chips">
        <span class="chip bn">বাংলা</span>
        <span class="chip hi">हिन्दी</span>
        <span class="chip ta">தமிழ்</span>
        <span class="chip hi">मराठी</span>
        <span class="chip en">English</span>
      </div>
      <div class="meta"><span class="line"></span> SUMMARY &nbsp;·&nbsp; AUDIO &nbsp;·&nbsp; DEADLINE &nbsp;·&nbsp; REPLY PDF</div>
    </div>
    <div class="right">
      <div class="doc">
        <div class="tag">OFFICIAL NOTICE</div>
        <h2>Bank loan notice</h2>
        <div class="ref">Ref: SBC/LOAN/2026/0942</div>
        <div class="lines"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="due"><i></i> Due 15 Oct 2026</div>
        <div class="btn">Reply PDF</div>
        <div class="stamp">LIPISETU</div>
      </div>
    </div>
  </div>
</body>
</html>
